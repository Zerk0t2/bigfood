<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIG FOOD</title>
    <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f4f1ed;
            --text-primary: #1b1b1f;
            --text-secondary: #6e6e73;
            --accent: #e63946;
            --accent-hover: #c1121f;
            --accent-glow: rgba(230, 57, 70, 0.2);
            --accent-soft: #fce4e6;
            --card-bg: #ffffff;
            --border: #d6d2ce;
            --input-bg: #f4f1ed;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.08);
            --shadow-xl: 0 30px 80px rgba(0,0,0,0.1);
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --gradient-accent: linear-gradient(135deg, #e63946, #f77f00);
            --gradient-warm: linear-gradient(135deg, #fce4e6, #fff3e6);
            --header-blur: blur(24px) saturate(1.6);
        }

        [data-theme="dark"] {
            --bg-primary: #111114;
            --bg-secondary: #1a1a1f;
            --text-primary: #f5f5f7;
            --text-secondary: #8e8e93;
            --accent: #ff6b6b;
            --accent-hover: #ff4757;
            --accent-glow: rgba(255, 107, 107, 0.25);
            --accent-soft: rgba(255, 107, 107, 0.12);
            --card-bg: #1c1c21;
            --border: #2c2c30;
            --input-bg: #232328;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.5);
            --shadow-xl: 0 30px 80px rgba(0,0,0,0.6);
            --gradient-warm: linear-gradient(135deg, rgba(255,107,107,0.08), rgba(247,127,0,0.08));
            --header-blur: blur(24px) saturate(1.4);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-font-smoothing: antialiased;
            line-height: 1.5;
        }

        header {
            background: var(--header-blur);
            backdrop-filter: var(--header-blur);
            -webkit-backdrop-filter: var(--header-blur);
            padding: 14px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 0 var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: all 0.4s ease;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 900;
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .logo:hover { transform: scale(1.06) rotate(-1deg); }
        .logo:active { transform: scale(0.98); }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-10px) rotate(2deg); }
            75% { transform: translateY(6px) rotate(-2deg); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }

        @keyframes rotateBadge {
            0% { transform: rotate(-4deg); }
            50% { transform: rotate(4deg); }
            100% { transform: rotate(-4deg); }
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.92) translateY(12px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fireGlow {
            from { box-shadow: 0 0 4px rgba(230,57,70,0.4); }
            to { box-shadow: 0 0 14px rgba(230,57,70,0.8), 0 0 28px rgba(230,57,70,0.2); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(80px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.94) translateY(16px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes overlayIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 20px var(--accent-glow); }
            50% { box-shadow: 0 0 40px var(--accent-glow), 0 0 60px rgba(230,57,70,0.1); }
        }

        .header-actions { display: flex; gap: 10px; align-items: center; }

        .theme-btn {
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            font-family: inherit;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .theme-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .cart-btn {
            background: var(--gradient-accent);
            border: none;
            color: white;
            padding: 10px 22px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            font-family: inherit;
            position: relative;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 16px rgba(230, 57, 70, 0.3);
        }
        .cart-btn:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 6px 24px rgba(230, 57, 70, 0.4); }
        .cart-btn.bounce { animation: bounce 0.3s ease-in-out; }

        .cart-count {
            background: #1b1b1f;
            color: white;
            border-radius: 50%;
            min-width: 20px;
            height: 20px;
            padding: 2px 6px;
            font-size: 0.65rem;
            font-weight: 800;
            position: absolute;
            top: -5px;
            right: -5px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: bounce 1s ease-in-out infinite;
        }

        main { max-width: 1200px; margin: 40px auto; padding: 0 24px; }

        .section-title {
            text-align: center;
            margin-bottom: 28px;
            color: var(--text-primary);
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: -1px;
            position: relative;
            display: inline-block;
            width: 100%;
        }
        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 4px;
            background: var(--gradient-accent);
            border-radius: 4px;
        }

        .search-box {
            max-width: 480px;
            margin: 0 auto 32px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 14px 44px 14px 48px;
            border-radius: 50px;
            border: 1.5px solid var(--border);
            background: var(--card-bg);
            color: var(--text-primary);
            font-size: 0.92rem;
            font-family: inherit;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
        }
        .search-box input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }
        .search-box input::placeholder { color: var(--text-secondary); opacity: 0.6; }
        .search-box .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.05rem;
            pointer-events: none;
        }
        .search-box .search-clear {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--bg-secondary);
            border: none;
            font-size: 0.9rem;
            cursor: pointer;
            color: var(--text-secondary);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-family: inherit;
        }
        .search-box .search-clear:hover { background: var(--accent); color: white; }

        .categories {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 36px;
            flex-wrap: wrap;
        }
        .cat-btn {
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 22px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.82rem;
            font-family: inherit;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .cat-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
        .cat-btn.active {
            background: var(--gradient-accent);
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 16px rgba(230, 57, 70, 0.3);
            transform: translateY(-2px);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 22px;
        }

        .food-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            animation: fadeInScale 0.5s ease-out backwards;
        }
        .food-card:nth-child(1) { animation-delay: 0.05s; }
        .food-card:nth-child(2) { animation-delay: 0.1s; }
        .food-card:nth-child(3) { animation-delay: 0.15s; }
        .food-card:nth-child(4) { animation-delay: 0.2s; }
        .food-card:nth-child(5) { animation-delay: 0.25s; }
        .food-card:nth-child(6) { animation-delay: 0.3s; }
        .food-card:nth-child(7) { animation-delay: 0.35s; }
        .food-card:nth-child(8) { animation-delay: 0.4s; }
        .food-card:nth-child(9) { animation-delay: 0.45s; }
        .food-card:nth-child(10) { animation-delay: 0.5s; }
        .food-card:nth-child(11) { animation-delay: 0.55s; }
        .food-card:nth-child(12) { animation-delay: 0.6s; }
        .food-card:nth-child(13) { animation-delay: 0.65s; }
        .food-card:nth-child(14) { animation-delay: 0.7s; }
        .food-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg), 0 0 0 1px var(--accent-glow);
            border-color: var(--accent);
        }

        .food-img {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gradient-warm);
            background-size: 200% 200%;
            animation: gradientMove 8s ease infinite;
            position: relative;
            overflow: hidden;
        }
        .food-img::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(to top, var(--card-bg), transparent);
        }
        .food-img .emoji-badge {
            font-size: 4.5rem;
            filter: drop-shadow(0 6px 20px rgba(0,0,0,0.12));
            animation: float 3s ease-in-out infinite;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .food-card:hover .emoji-badge { transform: scale(1.18) rotate(-5deg); }

        .food-info { padding: 16px 20px 20px; }
        .food-cuisine {
            display: inline-block;
            background: var(--accent-soft);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.68rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .food-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 50px;
            font-size: 0.68rem;
            font-weight: 700;
            margin-left: 6px;
            animation: rotateBadge 2.5s ease-in-out infinite;
        }
        .badge-hot { background: #fee2e2; color: #dc2626; animation: fireGlow 1.2s ease-in-out infinite alternate; }
        .badge-hit { background: #fff7ed; color: #ea580c; }
        .badge-new { background: #dcfce7; color: #16a34a; animation: bounce 2.5s ease-in-out infinite; }
        .badge-spicy { background: #fef2f2; color: #ef4444; animation: fireGlow 0.9s ease-in-out infinite alternate; }
        .badge-veg { background: #dcfce7; color: #16a34a; }
        .badge-chef { background: #f3e8ff; color: #9333ea; }

        .food-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; line-height: 1.3; letter-spacing: -0.3px; }
        .food-desc { color: var(--text-secondary); font-size: 0.82rem; margin-bottom: 14px; line-height: 1.5; }
        .food-price { font-size: 1.3rem; font-weight: 800; color: var(--accent); letter-spacing: -0.5px; }
        .food-bottom { display: flex; justify-content: space-between; align-items: center; }

        .add-btn {
            background: var(--gradient-accent);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            font-family: inherit;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 3px 12px rgba(230, 57, 70, 0.25);
        }
        .add-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 24px rgba(230, 57, 70, 0.35);
        }
        .add-btn:active { transform: translateY(0) scale(0.97); }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 200;
            justify-content: center;
            align-items: center;
            animation: overlayIn 0.3s ease;
        }
        .modal.active { display: flex; }

        .modal-content {
            background: var(--bg-primary);
            border-radius: var(--radius-xl);
            width: 92%;
            max-width: 480px;
            max-height: 88vh;
            overflow-y: auto;
            position: relative;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border);
            animation: modalIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-content::-webkit-scrollbar { width: 5px; }
        .modal-content::-webkit-scrollbar-track { background: transparent; }
        .modal-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .modal-content::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        .modal-close {
            position: absolute;
            top: 14px; right: 14px;
            background: rgba(0,0,0,0.3);
            border: none;
            color: white;
            font-size: 1.2rem;
            width: 32px; height: 32px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            backdrop-filter: blur(10px);
        }
        .modal-close:hover { background: rgba(0,0,0,0.55); transform: scale(1.1) rotate(90deg); }

        .detail-img {
            width: 100%;
            height: 230px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gradient-warm);
            background-size: 200% 200%;
            animation: gradientMove 8s ease infinite;
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            position: relative;
            overflow: hidden;
        }
        .detail-img .emoji-badge-lg {
            font-size: 6rem;
            filter: drop-shadow(0 8px 30px rgba(0,0,0,0.15));
            animation: float 3s ease-in-out infinite;
        }

        .detail-body { padding: 24px; }
        .detail-name { font-size: 1.45rem; font-weight: 800; margin-bottom: 8px; line-height: 1.3; letter-spacing: -0.5px; }
        .detail-desc { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.65; margin-bottom: 18px; }
        .detail-price { font-size: 1.7rem; font-weight: 900; color: var(--accent); margin-bottom: 22px; letter-spacing: -0.5px; }

        .detail-add-btn {
            width: 100%;
            background: var(--gradient-accent);
            border: none;
            color: white;
            padding: 15px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 18px rgba(230, 57, 70, 0.3);
        }
        .detail-add-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(230, 57, 70, 0.4); }

        .detail-section-title {
            font-size: 0.95rem;
            font-weight: 800;
            margin-top: 24px;
            margin-bottom: 12px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-rating { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        .detail-stars { display: flex; gap: 4px; }
        .detail-stars .star {
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: #d1d5db;
        }
        .detail-stars .star:hover { transform: scale(1.35); color: #fbbf24; }

        .review-item {
            background: var(--accent-soft);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            margin-bottom: 10px;
            border: 1px solid transparent;
            transition: all 0.25s ease;
        }
        .review-item:hover { border-color: var(--accent); transform: translateX(4px); }
        .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .review-author { font-weight: 700; font-size: 0.88rem; }
        .review-stars-display { color: #fbbf24; font-size: 0.82rem; letter-spacing: 2px; }
        .review-text { color: var(--text-secondary); font-size: 0.85rem; line-height: 1.55; }
        .no-reviews { color: var(--text-secondary); text-align: center; padding: 22px; font-size: 0.88rem; }

        .add-review-form { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
        .add-review-form input,
        .add-review-form textarea {
            background: var(--input-bg);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 0.88rem;
            font-family: inherit;
            resize: none;
            transition: all 0.3s ease;
        }
        .add-review-form input:focus,
        .add-review-form textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .submit-review-btn {
            background: var(--gradient-accent);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
            font-family: inherit;
            align-self: flex-start;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 3px 12px rgba(230, 57, 70, 0.25);
        }
        .submit-review-btn:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 6px 20px rgba(230, 57, 70, 0.35); }

        .cart-items { margin-bottom: 20px; }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }
        .cart-item:last-child { border-bottom: none; }
        .cart-item-info { flex: 1; }
        .cart-item-name { font-weight: 600; margin-bottom: 4px; font-size: 0.92rem; }
        .cart-item-price { color: var(--accent); font-weight: 700; font-size: 0.95rem; }
        .cart-item-actions { display: flex; align-items: center; gap: 10px; }

        .qty-btn {
            background: var(--accent-soft);
            border: 1.5px solid transparent;
            width: 34px; height: 34px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            color: var(--accent);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qty-btn:hover { background: var(--accent); color: white; transform: scale(1.12); }

        .cart-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 18px;
            border-top: 2px solid var(--border);
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 22px;
            letter-spacing: -0.5px;

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.value = 0.15;

        let currentUser = JSON.parse(localStorage.getItem('bigfood_user')) || null;
        let users = JSON.parse(localStorage.getItem('bigfood_users')) || [
            { name: "Админ", login: "admin", password: "671290", role: "admin", orders: [], points: 0 }
        ];
        let allOrders = JSON.parse(localStorage.getItem('bigfood_orders')) || [];

        function saveCart() { localStorage.setItem('bigfood_cart', JSON.stringify(cart)); }
        function saveTheme() { localStorage.setItem('bigfood_theme', isDarkTheme ? 'dark' : 'light'); }
        function saveReviews() {
            localStorage.setItem('bigfood_reviews', JSON.stringify(reviews));
            fbSave('bigfood/reviews', reviews);
        }
        function saveRatings() {
            localStorage.setItem('bigfood_ratings', JSON.stringify(ratings));
            fbSave('bigfood/ratings', ratings);
        }
        function saveUsers() {
            localStorage.setItem('bigfood_users', JSON.stringify(users));
            fbSave('bigfood/users', users);
        }
        function saveOrders() {
            localStorage.setItem('bigfood_orders', JSON.stringify(allOrders));
            fbSave('bigfood/orders', allOrders);
        }
        function saveCurrentUser() { localStorage.setItem('bigfood_user', JSON.stringify(currentUser)); }

        function onSearch() {
            searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            document.getElementById('searchClear').style.display = searchQuery ? 'block' : 'none';
            renderMenu();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            searchQuery = '';
            document.getElementById('searchClear').style.display = 'none';
            renderMenu();
        }

        function getAvgRating(id) {
            const r = reviews[id] || [];
            if (r.length === 0) return 0;
            return r.reduce((s, v) => s + v.stars, 0) / r.length;
        }

        function getRatingHTML(id) {
            const avg = getAvgRating(id);
            const count = (reviews[id] || []).length;
            if (count === 0) return '';
            let stars = '';
            for (let i = 1; i <= 5; i++) {
                stars += `<span style="color:${i <= Math.round(avg) ? '#ffc107' : '#ccc'}">★</span>`;
            }
            return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:0.85rem">
                <span>${stars}</span>
                <span style="color:var(--text-secondary)">${avg.toFixed(1)} (${count})</span>
            </div>`;
        }

        function getCategories() {
            return ["Все", ...new Set(menu.map(i => i.category))];
        }

        function renderCategories() {
            document.getElementById('categories').innerHTML = getCategories().map(cat =>
                `<button class="cat-btn ${cat === activeCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>`
            ).join('');
        }

        function setCategory(cat) {
            activeCategory = cat;
            renderCategories();
            renderMenu();
        }

        function updateAuthBtn() {
            const btn = document.getElementById('authBtn');
            if (currentUser) {
                btn.textContent = currentUser.name;
                btn.classList.add('logged-in');
                btn.onclick = openProfile;
            } else {
                btn.textContent = 'Войти';
                btn.classList.remove('logged-in');
                btn.onclick = openAuth;
            }
        }

        function openAuth() {
            playSound('click');
            if (currentUser) { openProfile(); return; }
            renderAuthForm('login');
            document.getElementById('authModal').classList.add('active');
        }

        function closeAuth() {
            playSound('click');
            document.getElementById('authModal').classList.remove('active');
        }

        function openProfile() {
            playSound('click');
            if (!currentUser) { openAuth(); return; }
            renderProfile();
            document.getElementById('profileModal').classList.add('active');
        }

        function closeProfile() {
            playSound('click');
            document.getElementById('profileModal').classList.remove('active');
        }

        function renderAuthForm(mode) {
            const isLogin = mode === 'login';
            document.getElementById('authModalContent').innerHTML = `
                <button class="modal-close" onclick="closeAuth()">×</button>
                <div class="auth-form">
                    <h2>${isLogin ? 'Вход' : 'Регистрация'}</h2>
                    ${!isLogin ? '<div class="form-group"><label>Имя</label><input type="text" id="authName" placeholder="Ваше имя"></div>' : ''}
                    <div class="form-group"><label>Логин</label><input type="text" id="authLogin" placeholder="Введите логин"></div>
                    <div class="form-group"><label>Пароль</label><input type="password" id="authPassword" placeholder="Введите пароль" onkeypress="if(event.key===\'Enter\')doAuth(\'' + mode + '\')"></div>
                    <button class="checkout-btn" onclick="doAuth('${mode}')">${isLogin ? 'Войти' : 'Зарегистрироваться'}</button>
                    <div class="switch">
                        ${isLogin ? 'Нет аккаунта? <a onclick="renderAuthForm(\'register\')">Зарегистрироваться</a>' : 'Уже есть аккаунт? <a onclick="renderAuthForm(\'login\')">Войти</a>'}
                    </div>
                </div>
            `;
        }

        function doAuth(mode) {
            const login = document.getElementById('authLogin').value.trim();
            const password = document.getElementById('authPassword').value.trim();

            if (mode === 'login') {
                const user = users.find(u => u.login === login && u.password === password);
                if (!user) return alert('Неверный логин или пароль!');
                currentUser = user;
                saveCurrentUser();
                closeAuth();
                updateAuthBtn();
                alert('Добро пожаловать, ' + user.name + '!');
            } else {
                const name = document.getElementById('authName').value.trim();
                if (!name) return alert('Введите имя!');
                if (!login) return alert('Введите логин!');
                if (!password) return alert('Введите пароль!');
                if (users.find(u => u.login === login)) return alert('Такой логин уже существует!');
                const newUser = { name, login, password, role: "user", orders: [], points: 0 };
                users.push(newUser);
                saveUsers();
                currentUser = newUser;
                saveCurrentUser();
                closeAuth();
                updateAuthBtn();
                alert('Регистрация успешна! Добро пожаловать, ' + name + '!');
            }
        }

        function logout() {
            if (!confirm('Выйти из аккаунта?')) return;
            currentUser = null;
            saveCurrentUser();
            closeProfile();
            updateAuthBtn();
        }

        function renderProfile() {
            const isAdmin = currentUser.role === 'admin';
            const userOrders = isAdmin ? allOrders.slice().reverse() : allOrders.filter(o => o.userLogin === currentUser.login).reverse();

            const statusColors = {
                'Новый': '#3498db',
                'Готовится': '#f39c12',

                'Выдан': '#2ecc71',
                'Отменён': '#e74c3c'
            };

            let ordersHTML = '';

                ordersHTML = '<div class="no-orders">Пока нет заказов</div>';
            } else {
                userOrders.forEach(order => {
                    const items = order.items.map(i => `${i.emoji} ${i.name} ×${i.qty}`).join(' · ');
                    const statusColor = statusColors[order.status] || '#3498db';

                    let adminActions = '';
                    if (isAdmin) {
                        const nextStatuses = {
                            'Новый': ['Готовится', 'Отменён'],
                            'Готовится': ['Готов к выдаче', 'Отменён'],
                            'Готов к выдаче': ['Доставляется', 'Выдан'],
                            'Доставляется': ['Выдан'],
                            'Выдан': [],
                            'Отменён': []
                        };
                        const nexts = nextStatuses[order.status] || [];
                        if (nexts.length > 0) {
                            adminActions = `<div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap">
                                ${nexts.map(s => `<button onclick="changeOrderStatus(${order.id},'${s}')" style="background:${statusColors[s]};color:white;border:none;padding:8px 16px;border-radius:20px;cursor:pointer;font-weight:600;font-size:0.8rem;transition:all 0.2s;box-shadow:0 2px 8px ${statusColors[s]}44" onmouseover="this.style.transform='scale(1.08)';this.style.boxShadow='0 4px 15px ${statusColors[s]}66'" onmouseout="this.style.transform='scale(1)';this.style.boxShadow='0 2px 8px ${statusColors[s]}44'">${s}</button>`).join('')}
                            </div>`;
                        }
                    }

                    ordersHTML += `<div class="order-card" style="border-left:4px solid ${statusColor}">
                        <div class="order-header">
                            <div>
                                <span class="order-date" style="font-weight:600;color:var(--text-primary)">#${order.id.toString().slice(-6)}</span>
                                <span class="order-date">${order.date}</span>
                            </div>
                            <span class="order-status" style="background:${statusColor};animation:none">${order.status}</span>
                        </div>
                        <div class="order-items" style="margin:8px 0">${items}</div>
                        <div style="display:flex;justify-content:space-between;align-items:center">
                            <div class="order-total">${order.total} ₽</div>
                            <span style="font-size:0.8rem;color:var(--text-secondary)">${order.customer}</span>
                        </div>
                        ${isAdmin ? `<div style="margin-top:8px;padding:8px 12px;background:var(--bg-secondary);border-radius:8px;font-size:0.8rem;color:var(--text-secondary);line-height:1.6">
                            📞 ${order.phone} · 📍 ${order.address}, кв.${order.apartment}, под.${order.entrance}, эт.${order.floor}
                            ${order.promo ? '<br>🏷️ Промокод: ' + order.promo : ''}
                        </div>` : ''}
                        ${adminActions}
                    </div>`;
                });
            }

            let statsHTML = '';
            if (isAdmin) {
                const newCount = allOrders.filter(o => o.status === 'Новый').length;
                const cookingCount = allOrders.filter(o => o.status === 'Готовится').length;
                const readyCount = allOrders.filter(o => o.status === 'Готов к выдаче').length;
                const deliveringCount = allOrders.filter(o => o.status === 'Доставляется').length;
                statsHTML = `
                <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px">
                    <div style="background:#3498db22;color:#3498db;border-radius:12px;padding:12px;text-align:center">
                        <div style="font-size:1.8rem;font-weight:800">${newCount}</div>
                        <div style="font-size:0.7rem;font-weight:600">Новые</div>
                    </div>
                    <div style="background:#f39c1222;color:#f39c12;border-radius:12px;padding:12px;text-align:center">
                        <div style="font-size:1.8rem;font-weight:800">${cookingCount}</div>
                        <div style="font-size:0.7rem;font-weight:600">Готовятся</div>
                    </div>
                    <div style="background:#27ae6022;color:#27ae60;border-radius:12px;padding:12px;text-align:center">
                        <div style="font-size:1.8rem;font-weight:800">${readyCount}</div>
                        <div style="font-size:0.7rem;font-weight:600">Готовы</div>
                    </div>
                    <div style="background:#9b59b622;color:#9b59b6;border-radius:12px;padding:12px;text-align:center">
                        <div style="font-size:1.8rem;font-weight:800">${deliveringCount}</div>
                        <div style="font-size:0.7rem;font-weight:600">Доставка</div>
                    </div>
                </div>`;
            }

            document.getElementById('profileModalContent').innerHTML = `
                <button class="modal-close" onclick="closeProfile()">×</button>
                <div class="profile-header">
                    <div class="profile-avatar" style="${isAdmin ? 'background:linear-gradient(135deg,#ff6b35,#ff4444)' : ''}">${currentUser.name[0]}</div>
                    <div>
                        <div class="profile-name">${currentUser.name}</div>
                        <div class="profile-role">${isAdmin ? 'Администратор' : 'Пользователь'}</div>
                    </div>
                    ${!isAdmin ? `<div style="margin-left:auto;text-align:right">
                        <div style="font-size:1.5rem;font-weight:800;color:var(--accent)">${currentUser.points || 0}</div>
                        <div style="font-size:0.75rem;color:var(--text-secondary)">баллов</div>
                    </div>` : ''}
                </div>
                <div class="profile-body">
                    ${!isAdmin ? `<div style="background:linear-gradient(135deg,var(--accent),#ff8c5a);color:white;border-radius:12px;padding:15px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center">
                        <div>
                            <div style="font-size:0.85rem;opacity:0.9">Ваши баллы</div>
                            <div style="font-size:2rem;font-weight:800">${currentUser.points || 0}</div>
                        </div>
                        <div style="text-align:right">
                            <div style="font-size:0.8rem;opacity:0.9">10 ₽ = 1 балл</div>
                            <div style="font-size:0.8rem;opacity:0.9">1 балл = 1 ₽ скидка</div>
                        </div>
                    </div>` : ''}
                    ${statsHTML}
                    <h3>${isAdmin ? 'Все заказы' : 'Мои заказы'} (${userOrders.length})</h3>
                    ${ordersHTML}
                    <button class="logout-btn" onclick="logout()">Выйти</button>
                </div>
            `;
        }

        function changeOrderStatus(orderId, newStatus) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) return;
            order.status = newStatus;
            saveOrders();
            renderProfile();

            if (newStatus === 'Готовится') {
                showNotification('Заказ #' + orderId + ' принят! Готовим ваш заказ 🍳');
            } else if (newStatus === 'Готов к выдаче') {
                showNotification('Заказ #' + orderId + ' готов! Можно забирать ✅');
            } else if (newStatus === 'Доставляется') {
                showNotification('Заказ #' + orderId + ' в пути! Скоро будет у вас 🚗');
            } else if (newStatus === 'Выдан') {
                showNotification('Заказ #' + orderId + ' выдан. Приятного аппетита! 🎉');
            } else if (newStatus === 'Отменён') {
                showNotification('Заказ #' + orderId + ' отменён ❌');
            }
        }

        function showNotification(text) {
            const notif = document.createElement('div');
            notif.style.cssText = 'position:fixed;top:20px;right:20px;background:var(--card-bg);color:var(--text-primary);padding:15px 25px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,0.2);z-index:9999;font-weight:600;max-width:350px;animation:slideInRight 0.4s ease;border-left:4px solid var(--accent)';
            notif.textContent = text;
            document.body.appendChild(notif);
            setTimeout(() => { notif.style.opacity = '0'; notif.style.transition = 'opacity 0.5s'; }, 3000);
            setTimeout(() => notif.remove(), 3500);
        }

        function renderMenu() {
            let filtered = activeCategory === "Все" ? menu : menu.filter(i => i.category === activeCategory);
            if (searchQuery) {
                filtered = filtered.filter(i =>
                    i.name.toLowerCase().includes(searchQuery) ||
                    i.desc.toLowerCase().includes(searchQuery) ||
                    i.cuisine.toLowerCase().includes(searchQuery) ||
                    i.category.toLowerCase().includes(searchQuery)
                );
            }
            const grid = document.getElementById('menuGrid');
            if (filtered.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-secondary);font-size:1.1rem">Ничего не найдено 🔍</div>';
                return;
            }
            grid.innerHTML = filtered.map(item => `
                <div class="food-card" onclick="openDetail(${item.id})">
                    <div class="food-img">
                        <span class="emoji-badge">${item.emoji}</span>
                    </div>
                    <div class="food-info">
                        <div class="food-name">${item.name}${item.badge ? `<span class="food-badge ${item.badge.class}">${item.badge.text}</span>` : ''}</div>
                        <div class="food-cuisine">${item.cuisine}</div>
                        <div class="food-desc">${item.desc.substring(0, 60)}...</div>
                        ${getRatingHTML(item.id)}
                        <div class="food-bottom">
                            <span class="food-price">${item.price} ₽</span>
                            <button class="add-btn" onclick="event.stopPropagation(); addToCart(${item.id})">В корзину</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function clearReviews() {
            const pass = prompt('Введите пароль:');
            if (pass !== '671290') return alert('Неверный пароль!');
            if (!confirm('Удалить все отзывы и рейтинги?')) return;
            reviews = {};
            ratings = {};
            saveReviews();
            saveRatings();
            renderMenu();
        }

        function openDetail(id) {
            const item = menu.find(i => i.id === id);
            const list = reviews[id] || [];
            const avg = getAvgRating(id);
            const count = list.length;
            const formStars = (reviews['_form'] && reviews['_form'][id]) || 0;

            const canReview = currentUser && !reviews[id]?.some(r => r.userLogin === currentUser.login);
            let starsInput = '';
            for (let i = 1; i <= 5; i++) {
                starsInput += `<span class="star" ${canReview ? `onclick="setDetailStar(${id},${i})"` : ''} style="color:${i <= formStars ? '#ffc107' : '#ccc'}">★</span>`;
            }

            let reviewsHTML = '';
            if (count === 0) {
                reviewsHTML = '<div class="no-reviews">Пока нет отзывов</div>';
            } else {
                list.forEach(r => {
                    reviewsHTML += `<div class="review-item">
                        <div class="review-header">
                            <span class="review-author">${r.name}</span>
                            <span class="review-stars-display">${'★'.repeat(r.stars)}${'☆'.repeat(5 - r.stars)}</span>
                        </div>
                        <div class="review-text">${r.text}</div>
                    </div>`;
                });
            }

            document.getElementById('detailContent').innerHTML = `
                <button class="modal-close" onclick="closeDetail()">×</button>
                <div class="detail-img">
                    <span class="emoji-badge-lg">${item.emoji}</span>
                </div>
                <div class="detail-body">
                    <div class="detail-name">${item.name} ${item.badge ? `<span class="food-badge ${item.badge.class}" style="font-size:0.9rem">${item.badge.text}</span>` : ''}</div>
                    <div class="food-cuisine" style="margin-bottom:4px">${item.cuisine}</div>
                    <div style="color:var(--text-secondary);font-size:0.85rem;margin-bottom:12px">Категория: ${item.category} · Готовка: ${item.prepTime} мин</div>
                    <div class="detail-desc">${item.desc}</div>
                    <div class="detail-price">${item.price} ₽</div>
                    <button class="detail-add-btn" onclick="addToCart(${item.id})">Добавить в корзину</button>

                    <div class="detail-section-title">Рейтинг</div>
                    <div class="detail-rating">
                        <div class="detail-stars" id="detailStars-${id}">${starsInput}</div>
                        <span style="font-size:0.95rem;color:var(--text-secondary)">${avg > 0 ? avg.toFixed(1) : '—'} (${count})</span>
                    </div>

                    <div class="detail-section-title">Отзывы</div>
                    ${reviewsHTML}

                    ${currentUser && !reviews[id]?.some(r => r.userLogin === currentUser.login) ? `
                    <div class="add-review-form">
                        <textarea id="reviewText-${id}" rows="3" placeholder="Напишите отзыв..."></textarea>
                        <button class="submit-review-btn" onclick="submitReview(${id})">Отправить отзыв</button>
                    </div>` : !currentUser ? '<div class="no-reviews">Войдите, чтобы оставить отзыв</div>' : '<div class="no-reviews">Вы уже оставили отзыв на это блюдо</div>'}
                </div>
            `;
            document.getElementById('detailModal').classList.add('active');
        }

        function setDetailStar(id, star) {
            if (!reviews['_form']) reviews['_form'] = {};
            reviews['_form'][id] = star;
            const container = document.getElementById('detailStars-' + id);
            if (container) {
                container.querySelectorAll('.star').forEach((s, i) => {
                    s.style.color = i < star ? '#ffc107' : '#ccc';
                });
            }
        }

        function submitReview(id) {
            const text = document.getElementById('reviewText-' + id).value.trim();
            const stars = (reviews['_form'] && reviews['_form'][id]) || 3;
            if (!currentUser) return alert('Войдите, чтобы оставить отзыв');
            if (!text) return alert('Напишите отзыв');
            if (!reviews[id]) reviews[id] = [];
            if (reviews[id].some(r => r.userLogin === currentUser.login)) return alert('Вы уже оставляли отзыв на это блюдо');
            reviews[id].push({ name: currentUser.name, userLogin: currentUser.login, text, stars });
            ratings[id] = stars;
            delete reviews['_form'][id];
            saveReviews();
            saveRatings();
            renderMenu();
            openDetail(id);
        }

        function closeDetail() {
            document.getElementById('detailModal').classList.remove('active');
        }

        function addToCart(id) {
            const item = menu.find(i => i.id === id);
            const existing = cart.find(i => i.id === id);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...item, qty: 1 });
            }
            updateCartCount();
            saveCart();
            playSound('add');
            const cartBtn = document.querySelector('.cart-btn');
            cartBtn.classList.remove('bounce');
            void cartBtn.offsetWidth;
            cartBtn.classList.add('bounce');
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            updateCartCount();
            saveCart();
            playSound('remove');
            renderCartModal();
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    removeFromCart(id);
                } else {
                    saveCart();
                    renderCartModal();
                }
            }
        }

        function updateCartCount() {
            document.getElementById('cartCount').textContent = cart.reduce((sum, item) => sum + item.qty, 0);
        }

        function applyPromo() {
            const code = document.getElementById('promoInput').value.trim().toUpperCase();
            const msgEl = document.getElementById('promoMsg');
            if (promos[code]) {
                appliedPromo = { code, ...promos[code] };
                msgEl.className = 'promo-msg ok';
                msgEl.textContent = '✓ ' + promos[code].label;
            } else {
                appliedPromo = null;
                msgEl.className = 'promo-msg err';
                msgEl.textContent = 'Промокод не найден';
            }
            renderCartModal();
        }

        function getDiscount(subtotal) {
            if (!appliedPromo) return 0;
            if (appliedPromo.type === 'percent') return Math.round(subtotal * appliedPromo.value / 100);
            if (appliedPromo.type === 'fixed') return Math.min(appliedPromo.value, subtotal);
            return 0;
        }

        let usePointsFlag = false;

        function togglePoints() {
            usePointsFlag = document.getElementById('usePoints') ? document.getElementById('usePoints').checked : false;
            renderCartModal();
        }

        function getPointsDiscount(subtotal) {
            if (!currentUser || currentUser.role === 'admin') return 0;
            if (!usePointsFlag || appliedPromo) return 0;
            const pts = currentUser.points || 0;
            return Math.min(pts, subtotal);
        }

        function renderCartModal() {
            const container = document.getElementById('cartModalContent');
            const subtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
            const discount = getDiscount(subtotal);
            const pointsDiscount = getPointsDiscount(subtotal - discount);
            const total = subtotal - discount - pointsDiscount;

            let html = `<div style="padding:25px">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
                    <span style="font-size:1.5rem;font-weight:700">Корзина</span>
                    <button class="modal-close" style="position:static" onclick="closeCart()">×</button>
                </div>`;

            if (cart.length === 0) {
                html += '<div class="empty-cart">Корзина пуста</div>';
            } else {
                html += '<div class="cart-items">';
                cart.forEach(item => {
                    html += `<div class="cart-item">
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.emoji} ${item.name}</div>
                            <div class="cart-item-price">${item.price * item.qty} ₽</div>
                        </div>
                        <div class="cart-item-actions">
                            <button class="qty-btn" onclick="changeQty(${item.id}, -1)">−</button>
                            <span style="font-weight:600;min-width:20px;text-align:center">${item.qty}</span>
                            <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                        </div>
                    </div>`;
                });
                html += '</div>';

                if (discount > 0) {
                    html += `<div class="discount-line"><span>Промокод (${appliedPromo.code})</span><span>-${discount} ₽</span></div>`;
                }

                if (currentUser && currentUser.role !== 'admin') {
                    const userPts = currentUser ? (currentUser.points || 0) : 0;
                    if (userPts > 0 && !appliedPromo) {
                        html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 15px;background:var(--bg-secondary);border-radius:10px;margin-bottom:10px">
                            <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
                                <input type="checkbox" id="usePoints" ${usePointsFlag ? 'checked' : ''} onchange="togglePoints()"> Использовать баллы (${userPts})
                            </label>
                            <span style="color:var(--accent);font-weight:600">-${Math.min(userPts, subtotal)} ₽</span>
                        </div>`;
                    }
                }

                html += `<div class="cart-total"><span>Итого:</span><span>${total} ₽</span></div>`;

                html += `<div class="checkout-form">
                    <div class="form-group">
                        <label>Промокод</label>
                        <div class="promo-row">
                            <input type="text" id="promoInput" placeholder="Введите промокод" value="${appliedPromo ? appliedPromo.code : ''}" onkeypress="if(event.key==='Enter')applyPromo()">
                            <button class="promo-apply-btn" onclick="applyPromo()">Применить</button>
                        </div>
                        <div id="promoMsg" class="promo-msg">${appliedPromo ? '✓ ' + appliedPromo.label : ''}</div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Имя</label><input type="text" id="fname" placeholder="Иван"></div>
                        <div class="form-group"><label>Фамилия</label><input type="text" id="lname" placeholder="Иванов"></div>
                    </div>
                    <div class="form-group"><label>Телефон</label><input type="tel" id="phone" placeholder="+7 (999) 123-45-67"></div>
                    <div class="form-group"><label>Адрес</label><input type="text" id="address" placeholder="ул. Примерная, д. 1"></div>
                    <div class="form-row">
                        <div class="form-group"><label>Квартира</label><input type="text" id="apartment" placeholder="42"></div>
                        <div class="form-group"><label>Подъезд</label><input type="text" id="entrance" placeholder="3"></div>
                    </div>
                    <div class="form-group"><label>Этаж</label><input type="text" id="floor" placeholder="5"></div>
                    <button class="checkout-btn" onclick="checkout()">Оформить заказ</button>
                </div>`;
            }
            html += '</div>';
            container.innerHTML = html;
        }

        function openCart() {
            playSound('click');
            renderCartModal();
            document.getElementById('cartModal').classList.add('active');
        }

        function closeCart() {
            document.getElementById('cartModal').classList.remove('active');
        }

        function toggleTheme() {
            isDarkTheme = !isDarkTheme;
            document.documentElement.setAttribute('data-theme', isDarkTheme ? 'dark' : 'light');
            document.querySelector('.theme-btn').textContent = isDarkTheme ? 'Светлая тема' : 'Тёмная тема';
            saveTheme();
            playSound('theme');
        }

        let pendingOrder = null;

        function checkout() {
            const fname = document.getElementById('fname').value.trim();
            const lname = document.getElementById('lname').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();
            const apartment = document.getElementById('apartment').value.trim();
            const entrance = document.getElementById('entrance').value.trim();
            const floor = document.getElementById('floor').value.trim();

            if (!fname || !lname || !phone || !address || !apartment || !entrance || !floor) {
                return alert('Заполните все поля!');
            }

            const subtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
            const discount = getDiscount(subtotal);
            const pointsDiscount = getPointsDiscount(subtotal - discount);
            const total = subtotal - discount - pointsDiscount;

            pendingOrder = {
                fname, lname, phone, address, apartment, entrance, floor,
                subtotal, discount, pointsDiscount, total
            };

            renderPayment();
        }

        function renderPayment() {
            const o = pendingOrder;
            const container = document.getElementById('cartModalContent');

            const itemsHTML = cart.map(item =>
                `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
                    <span>${item.emoji} ${item.name} ×${item.qty}</span>
                    <span style="font-weight:600">${item.price * item.qty} ₽</span>
                </div>`
            ).join('');

            let discountHTML = '';
            if (o.discount > 0) {
                discountHTML += `<div class="discount-line"><span>Промокод</span><span>-${o.discount} ₽</span></div>`;
            }
            if (o.pointsDiscount > 0) {
                discountHTML += `<div class="discount-line"><span>Баллы</span><span>-${o.pointsDiscount} ₽</span></div>`;
            }

            container.innerHTML = `<div style="padding:28px">
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
                    <button onclick="backToCheckout()" style="background:var(--bg-secondary);border:1.5px solid var(--border);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:all 0.2s;color:var(--text-primary)">←</button>
                    <span style="font-size:1.4rem;font-weight:800">Оплата</span>
                </div>

                <div class="payment-summary">
                    <div style="font-weight:700;margin-bottom:10px;font-size:0.9rem;color:var(--text-secondary)">Ваш заказ</div>
                    ${itemsHTML}
                    ${discountHTML}
                    <div style="display:flex;justify-content:space-between;padding-top:12px;margin-top:4px">
                        <span style="font-weight:800;font-size:1.05rem">Итого</span>
                        <span style="font-weight:800;font-size:1.15rem;color:var(--accent)">${o.total} ₽</span>
                    </div>
                </div>

                <div class="payment-method-title">Способ оплаты</div>
                <div class="payment-methods">
                    <button class="payment-method active" onclick="selectPaymentMethod('card', this)">
                        <span class="payment-method-icon">💳</span>
                        <span>Перевод (СБП)</span>
                    </button>
                    <button class="payment-method" onclick="selectPaymentMethod('cash', this)">
                        <span class="payment-method-icon">💵</span>
                        <span>Наличные</span>
                    </button>
                </div>

                <div id="cardFields">
                    <div class="payment-details">
                        <div class="payment-detail-row">
                            <span class="payment-detail-label">Перевод на карту</span>
                            <div class="payment-detail-value">
                                <span id="sellerCard">${SELLER_CARD}</span>
                                <button class="copy-btn" onclick="copyText('${SELLER_CARD}', this)">Копировать</button>
                            </div>
                        </div>
                        <div class="payment-detail-row">
                            <span class="payment-detail-label">Или по номеру телефона (СБП)</span>
                            <div class="payment-detail-value">
                                <span id="sellerPhone">${SELLER_PHONE}</span>
                                <button class="copy-btn" onclick="copyText('${SELLER_PHONE}', this)">Копировать</button>
                            </div>
                        </div>
                        <div class="payment-detail-row">
                            <span class="payment-detail-label">Получатель</span>
                            <div class="payment-detail-value">
                                <span>${SELLER_NAME}</span>
                            </div>
                        </div>
                        <div class="payment-detail-row" style="background:var(--accent-glow);border-color:var(--accent)">
                            <span class="payment-detail-label" style="color:var(--accent)">Сумма к переводу</span>
                            <div class="payment-detail-value" style="color:var(--accent);font-size:1.3rem;font-weight:800">
                                ${o.total} ₽
                            </div>
                        </div>
                    </div>
                </div>

                <button class="checkout-btn" id="payBtn" onclick="processPayment()" style="margin-top:20px">
                    Оплатить ${o.total} ₽
                </button>
                <button class="back-to-cart-btn" onclick="backToCartFromPayment()">Вернуться в корзину</button>
            </div>`;
        }

        let selectedPaymentMethod = 'card';
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:3000' : window.location.origin;

        const SELLER_CARD = '2202 2088 8719 3630';
        const SELLER_PHONE = '+7 981 863 93 65';
        const SELLER_NAME = 'БИГ FOOD';

        function selectPaymentMethod(method, btn) {
            selectedPaymentMethod = method;
            document.querySelectorAll('.payment-method').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('cardFields').style.display = method === 'card' ? 'block' : 'none';
        }

        function formatCardNumber(input) {
            let v = input.value.replace(/\D/g, '').substring(0, 16);
            input.value = v.replace(/(.{4})/g, '$1 ').trim();
        }

        function formatExpiry(input) {
            let v = input.value.replace(/\D/g, '').substring(0, 4);
            if (v.length >= 2) v = v.substring(0, 2) + '/' + v.substring(2);
            input.value = v;
        }

        function processPayment() {
            completeOrder();
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = 'Скопировано!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Копировать';
                    btn.classList.remove('copied');
                }, 1500);
            });
        }

        function completeOrder() {
            const o = pendingOrder;
            const dishTimes = cart.map(item => ({
                name: item.name, emoji: item.emoji, qty: item.qty,
                time: (item.prepTime || 10) * item.qty
            }));
            const maxPrep = Math.max(...dishTimes.map(d => d.time));
            const deliveryTime = maxPrep + 15;
            const now = new Date();
            const readyDate = new Date(now.getTime() + maxPrep * 60000);
            const deliveryDate = new Date(now.getTime() + deliveryTime * 60000);
            const formatTime = (d) => d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');

            let dishTimesHTML = dishTimes.map(d =>
                `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)">
                    <span>${d.emoji} ${d.name} ×${d.qty}</span>
                    <span style="font-weight:600">${d.time} мин</span>
                </div>`
            ).join('');

            let discountHTML = '';
            if (o.discount > 0) discountHTML += `<div class="discount-line"><span>Промокод</span><span>-${o.discount} ₽</span></div>`;
            if (o.pointsDiscount > 0) discountHTML += `<div class="discount-line"><span>Баллы</span><span>-${o.pointsDiscount} ₽</span></div>`;

            const payLabel = selectedPaymentMethod === 'card' ? '💳 Карта' : '💵 Наличные';

            document.getElementById('cartModalContent').innerHTML = `<div style="padding:30px">
                <div class="order-success">
                    <div class="icon">✅</div>
                    <h3>Заказ оформлен!</h3>
                    <p><strong>${o.fname} ${o.lname}</strong></p>
                    <p>Телефон: ${o.phone}</p>
                    <p>Адрес: ${o.address}, кв. ${o.apartment}, под. ${o.entrance}, эт. ${o.floor}</p>
                    <p style="margin-top:8px;color:var(--accent);font-weight:600">${payLabel}</p>
                    <hr style="margin:15px 0;border-color:var(--border)">
                    <div style="text-align:left">${cart.map(item => `${item.emoji} ${item.name} ×${item.qty} — ${item.price * item.qty} ₽`).join('<br>')}</div>
                    ${discountHTML}
                    <hr style="margin:15px 0;border-color:var(--border)">
                    <p style="font-weight:700;text-align:left">Время готовки:</p>
                    <div style="text-align:left;margin:10px 0">${dishTimesHTML}</div>
                    <div style="background:var(--bg-secondary);border-radius:12px;padding:15px;margin-top:10px;text-align:left">
                        <p>Готовка: <strong>${maxPrep} мин</strong> (к ${formatTime(readyDate)})</p>
                        <p>Доставка: <strong>${deliveryTime} мин</strong> (к ${formatTime(deliveryDate)})</p>
                    </div>
                    <hr style="margin:15px 0;border-color:var(--border)">
                    <p><strong>Итого: ${o.total} ₽</strong></p>
                    <p style="margin-top:15px;color:var(--accent)">Спасибо за заказ!</p>
                </div>
            </div>`;

            const order = {
                id: Date.now(),
                date: new Date().toLocaleString('ru-RU'),
                customer: o.fname + ' ' + o.lname,
                phone: o.phone, address: o.address, apartment: o.apartment, entrance: o.entrance, floor: o.floor,
                items: cart.map(i => ({ emoji: i.emoji, name: i.name, qty: i.qty, price: i.price })),
                total: o.total,
                discount: o.discount,
                promo: appliedPromo ? appliedPromo.code : null,
                status: 'Новый',
                userLogin: currentUser ? currentUser.login : 'guest',
                payment: selectedPaymentMethod
            };
            allOrders.push(order);
            saveOrders();

            if (currentUser && currentUser.login !== 'admin') {
                const earned = Math.floor(o.total / 10);
                const user = users.find(u => u.login === currentUser.login);
                if (user) {
                    let pointsUsed = 0;
                    if (usePointsFlag && !appliedPromo) {
                        pointsUsed = getPointsDiscount(o.subtotal - o.discount);
                        user.points = (user.points || 0) - pointsUsed;
                    }
                    user.points = (user.points || 0) + earned;
                    currentUser = user;
                    saveUsers();
                    saveCurrentUser();
                    usePointsFlag = false;
                }
                showNotification('Заказ #' + order.id + ' принят! Заработано: +' + earned + ' баллов 🎁');
            } else if (currentUser && currentUser.role === 'admin') {
                showNotification('Новый заказ #' + order.id + ' от ' + o.fname + ' ' + o.lname + '!');
            }

            cart = [];
            appliedPromo = null;
            pendingOrder = null;
            updateCartCount();
            saveCart();
        }

        function backToCheckout() {
            if (!pendingOrder) return;
            const o = pendingOrder;
            renderCartModal();
            setTimeout(() => {
                const f = id => document.getElementById(id);
                if (f('fname')) f('fname').value = o.fname;
                if (f('lname')) f('lname').value = o.lname;
                if (f('phone')) f('phone').value = o.phone;
                if (f('address')) f('address').value = o.address;
                if (f('apartment')) f('apartment').value = o.apartment;
                if (f('entrance')) f('entrance').value = o.entrance;
                if (f('floor')) f('floor').value = o.floor;
            }, 30);
        }

        function backToCartFromPayment() {
            pendingOrder = null;
            renderCartModal();
        }

        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target.id === 'detailModal') closeDetail();
        });
        document.getElementById('cartModal').addEventListener('click', (e) => {
            if (e.target.id === 'cartModal') closeCart();
        });
        document.getElementById('authModal').addEventListener('click', (e) => {
            if (e.target.id === 'authModal') closeAuth();
        });
        document.getElementById('profileModal').addEventListener('click', (e) => {
            if (e.target.id === 'profileModal') closeProfile();
        });

        if (isDarkTheme) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.querySelector('.theme-btn').textContent = 'Светлая тема';
        }

        fbLoad('bigfood/orders', data => { if (data) { allOrders = data; saveOrders(); if (currentUser && currentUser.role === 'admin') renderProfile(); } });
        fbLoad('bigfood/users', data => { if (data) { users = data; saveUsers(); } });
        fbLoad('bigfood/reviews', data => { if (data) { reviews = data; saveReviews(); renderMenu(); } });
        fbLoad('bigfood/ratings', data => { if (data) { ratings = data; saveRatings(); } });

        db.ref('bigfood/orders').on('value', snap => {
            if (snap.val()) { allOrders = snap.val(); localStorage.setItem('bigfood_orders', JSON.stringify(allOrders)); updateCartCount(); if (currentUser && currentUser.role === 'admin') renderProfile(); }
        });
        db.ref('bigfood/users').on('value', snap => {
            if (snap.val()) { users = snap.val(); localStorage.setItem('bigfood_users', JSON.stringify(users)); }
        });
        db.ref('bigfood/reviews').on('value', snap => {
            if (snap.val()) { reviews = snap.val(); localStorage.setItem('bigfood_reviews', JSON.stringify(reviews)); renderMenu(); }
        });

        updateCartCount();
        updateAuthBtn();
        renderCategories();
        renderMenu();
    </script>
</body>
</html>
